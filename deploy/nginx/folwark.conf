# Folwark – nginx + PHP-FPM. Certyfikat dla sieci lokalnej np. z mkcert albo własnego CA.
server {
    listen 80;
    server_name folwark.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name folwark.local;

    ssl_certificate     /etc/ssl/folwark/folwark.local.pem;
    ssl_certificate_key /etc/ssl/folwark/folwark.local-key.pem;

    root /srv/folwark/public;
    client_max_body_size 25m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
