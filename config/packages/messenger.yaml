framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'
        routing:
            'App\Message\AsyncMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
