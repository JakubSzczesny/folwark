security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_OWNER: [ROLE_WORKER, ROLE_ACCOUNTANT]
        ROLE_WORKER: [ROLE_USER]
        ROLE_ACCOUNTANT: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|media)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_dashboard
            custom_authenticators:
                - App\Security\PinAuthenticator
            entry_point: form_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                signature_properties: ['password', 'active']
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/logowanie, roles: PUBLIC_ACCESS }
        - { path: ^/pin, roles: PUBLIC_ACCESS }
        - { path: ^/ustawienia, roles: ROLE_OWNER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
