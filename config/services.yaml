parameters:
    ksef.auth_poll_interval_ms: 1000
    app.release_file: '%kernel.project_dir%/var/wersja.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Ksef\KsefClient:
        factory: ['@App\Ksef\KsefClientSelector', 'select']

    App\WhiteList\WhiteListClient:
        factory: ['@App\WhiteList\WhiteListClientSelector', 'select']

when@test:
    parameters:
        ksef.auth_poll_interval_ms: 0
        app.release_file: '%kernel.project_dir%/var/wersja-test.json'
